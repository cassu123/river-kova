<!DOCTYPE html>
<!--
================================================================================
Project     : River Kova — Household Chore Robot Control System
File        : api/dashboard.html
Purpose     : Self-contained control dashboard served at GET / by the local
              control API. Polls /status once a second and renders a top-down
              map of the home (rooms, dock, objects, robot pose + heading),
              live status, and controls (voice command, chore queue, e-stop).
              Body-agnostic: works identically against the simulated body and
              real hardware — the map simply hides if no world snapshot is
              published. No build step, no external dependencies.
Author      : [Author Placeholder]
Version     : 1.0.0
License     : Proprietary — River Song AI (riversongai.com)
================================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>River Kova — Control</title>
<style>
  :root {
    --bg: #11151c; --panel: #1a2029; --line: #2b3442; --text: #d7dee8;
    --dim: #8593a5; --accent: #4cc2ff; --ok: #41d98d; --warn: #ffc857;
    --bad: #ff5d5d; --chip: #232c38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 17px; letter-spacing: .4px; }
  header .sub { color: var(--dim); font-size: 12px; }
  #conn { margin-left: auto; font-size: 12px; }
  main {
    display: grid; grid-template-columns: minmax(0, 1fr) 320px;
    gap: 16px; padding: 16px 20px; max-width: 1200px; margin: 0 auto;
  }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px;
  }
  .panel h2 {
    margin: 0 0 10px; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .8px; color: var(--dim);
  }
  #map { width: 100%; display: block; border-radius: 6px; background: #0c0f14; }
  #nomap { color: var(--dim); padding: 30px 10px; text-align: center; display: none; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; }
  .row .k { color: var(--dim); }
  .chip {
    display: inline-block; padding: 1px 9px; border-radius: 99px;
    background: var(--chip); font-size: 12px; font-weight: 600;
  }
  .chip.ok   { color: var(--ok); }
  .chip.warn { color: var(--warn); }
  .chip.bad  { color: var(--bad); }
  #batt-wrap { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; margin-top: 4px; }
  #batt-bar { height: 100%; width: 0; background: var(--ok); transition: width .5s; }
  input, select, button {
    font: inherit; color: var(--text); background: var(--chip);
    border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px;
  }
  input:focus, select:focus { outline: 1px solid var(--accent); }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .ctl { display: flex; gap: 8px; margin-bottom: 10px; }
  .ctl input, .ctl select { flex: 1; min-width: 0; }
  #estop {
    width: 100%; padding: 12px; font-weight: 700; letter-spacing: 1px;
    background: #3a1518; border-color: #6e2227; color: var(--bad);
  }
  #estop:hover { background: #4d1a1e; border-color: var(--bad); }
  #estop-clear { width: 100%; margin-top: 8px; color: var(--dim); }
  #msg { min-height: 18px; font-size: 12px; color: var(--dim); margin-top: 8px; word-break: break-word; }
  .stack > .panel + .panel { margin-top: 16px; }
</style>
</head>
<body>

<header>
  <h1>River Kova</h1>
  <span class="sub" id="robot-id">—</span>
  <span id="conn" class="chip bad">connecting…</span>
</header>

<main>
  <div class="panel">
    <h2>Home — top-down</h2>
    <canvas id="map" width="820" height="640"></canvas>
    <div id="nomap">No world snapshot published — map view unavailable on this body.</div>
  </div>

  <div class="stack">
    <div class="panel">
      <h2>Status</h2>
      <div class="row"><span class="k">State</span><span class="chip" id="state">—</span></div>
      <div class="row"><span class="k">Safety</span><span class="chip" id="safety">—</span></div>
      <div class="row"><span class="k">Room</span><span id="room">—</span></div>
      <div class="row"><span class="k">Recognised as</span><span id="recognized">—</span></div>
      <div class="row"><span class="k">Rooms learned</span><span id="rooms-learned">—</span></div>
      <div class="row"><span class="k">Floor mapped</span><span id="mapped">—</span></div>
      <div class="row"><span class="k">Holding</span><span id="holding">—</span></div>
      <div class="row"><span class="k">Active task</span><span id="active">—</span></div>
      <div class="row"><span class="k">Queued</span><span id="queued">—</span></div>
      <div class="row"><span class="k">Battery</span><span id="batt-pct">—</span></div>
      <div id="batt-wrap"><div id="batt-bar"></div></div>
    </div>

    <div class="panel">
      <h2>Command</h2>
      <div class="ctl">
        <input id="voice" placeholder='e.g. "have kova feed the dogs"'>
        <button id="voice-send">Send</button>
      </div>
      <div class="ctl">
        <select id="chore"></select>
        <select id="room-pick"><option value="">any room</option></select>
        <button id="chore-send">Queue</button>
      </div>
      <button id="estop">E-STOP</button>
      <button id="estop-clear">Clear e-stop</button>
      <div id="msg"></div>
    </div>
  </div>
</main>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const POLL_MS = 1000;
const TRAIL_MAX = 120;

const OBJECT_COLORS = {
  cup: "#ffc857", sock: "#c792ea", trash_bag: "#8593a5",
  bottle: "#4cc2ff", dog_bowl: "#ff9e64", scoop: "#9ece6a",
};
const FIXTURE_KINDS = new Set([
  "stove", "fridge", "dishwasher", "couch", "tv", "coffee_table",
  "bed", "dresser", "toilet", "bathtub", "coat_rack", "shoe_rack",
]);

let trail = [];
let roomsSeen = false;

function setMsg(text, bad) {
  $("msg").textContent = text;
  $("msg").style.color = bad ? "var(--bad)" : "var(--dim)";
}

async function post(path, body) {
  try {
    const res = await fetch(path, {
      method: "POST",
      headers: body ? { "content-type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { setMsg(data.detail || `${path} failed (${res.status})`, true); return null; }
    return data;
  } catch (err) {
    setMsg(`${path}: ${err.message}`, true);
    return null;
  }
}

// ── Status panel ─────────────────────────────────────────────────────────────

function chipClass(el, value, okSet, warnSet) {
  el.textContent = value ?? "—";
  el.className = "chip " + (okSet.includes(value) ? "ok" : warnSet.includes(value) ? "warn" : "bad");
}

function renderStatus(s) {
  $("robot-id").textContent = s.robot_id ?? "—";
  chipClass($("state"), s.state, ["IDLE", "EXECUTING_TASK"], ["RETURNING_TO_BASE", "CHARGING", "BOOTING"]);
  chipClass($("safety"), s.safety_level, ["NOMINAL"], ["WARN", "SLOW"]);
  $("active").textContent = s.active_task ? (s.active_task.name || s.active_task.chore_type || "yes") : "—";
  $("queued").textContent = s.queue_size ?? "—";

  const sim = s.sim || {};
  $("room").textContent = sim.room ?? "—";
  $("holding").textContent = sim.holding ?? "—";

  const rec = s.recognition || {};
  $("recognized").textContent = rec.current_room && rec.current_room !== "unknown"
    ? `${rec.current_room} (${Math.round((rec.current_confidence || 0) * 100)}%)`
    : "not yet";
  const learned = Object.keys(rec.rooms || {});
  $("rooms-learned").textContent = learned.length ? learned.join(", ") : "none yet";
  $("mapped").textContent = s.mapping ? s.mapping.explored_m2.toFixed(1) + " m²" : "—";

  const batt = s.battery_pct ?? sim.battery_pct;
  if (batt != null) {
    $("batt-pct").textContent = batt.toFixed(0) + "%" + (sim.charging ? " ⚡ charging" : "");
    $("batt-bar").style.width = batt + "%";
    $("batt-bar").style.background = batt > 40 ? "var(--ok)" : batt > 20 ? "var(--warn)" : "var(--bad)";
  }
}

// ── Map rendering ────────────────────────────────────────────────────────────

function renderMap(sim, recognition, mapping) {
  const canvas = $("map");
  if (!sim || !sim.rooms || !sim.rooms.length) {
    canvas.style.display = "none";
    $("nomap").style.display = "block";
    return;
  }
  canvas.style.display = "block";
  $("nomap").style.display = "none";

  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height, PAD = 34;

  const xs = sim.rooms.flatMap(r => [r.x0, r.x1]);
  const ys = sim.rooms.flatMap(r => [r.y0, r.y1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const scale = Math.min((W - 2 * PAD) / (maxX - minX), (H - 2 * PAD) / (maxY - minY));
  const px = (x) => PAD + (x - minX) * scale;
  const py = (y) => H - PAD - (y - minY) * scale;   // world y-up → screen y-down

  ctx.clearRect(0, 0, W, H);

  // Rooms
  for (const r of sim.rooms) {
    ctx.fillStyle = "#161b24";
    ctx.strokeStyle = "#36425466";
    ctx.lineWidth = 1.5;
    ctx.fillRect(px(r.x0), py(r.y1), (r.x1 - r.x0) * scale, (r.y1 - r.y0) * scale);
    ctx.strokeRect(px(r.x0), py(r.y1), (r.x1 - r.x0) * scale, (r.y1 - r.y0) * scale);
    ctx.fillStyle = "#8593a5";
    ctx.font = "11px system-ui";
    ctx.fillText(r.name.replace("_", " "), px(r.x0) + 6, py(r.y1) + 14);
  }

  // Discovered structure — the robot's own LiDAR map (vacuum-style):
  // mapped floor lightens, discovered walls draw solid
  if (mapping && mapping.rows) {
    const res = mapping.resolution_m, cw = res * scale + 0.5;
    for (let j = 0; j < mapping.rows.length; j++) {
      const row = mapping.rows[j];
      const wy = mapping.origin_y + j * res;
      for (let i = 0; i < row.length; i++) {
        const c = row[i];
        if (c === "?") continue;
        const wx = mapping.origin_x + i * res;
        ctx.fillStyle = c === "#" ? "#7d93b2" : "#1d2531";
        ctx.fillRect(px(wx), py(wy + res), cw, cw);
      }
    }
  }

  // True walls — faint, so you can compare against what the robot mapped
  for (const w of sim.walls || []) {
    ctx.beginPath();
    ctx.moveTo(px(w.x0), py(w.y0));
    ctx.lineTo(px(w.x1), py(w.y1));
    ctx.strokeStyle = "#36425466";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Dock
  if (sim.dock) {
    ctx.beginPath();
    ctx.arc(px(sim.dock.x), py(sim.dock.y), 9, 0, Math.PI * 2);
    ctx.strokeStyle = "var(--ok)";
    ctx.setLineDash([3, 3]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#41d98d99";
    ctx.font = "10px system-ui";
    ctx.fillText("dock", px(sim.dock.x) + 12, py(sim.dock.y) + 3);
  }

  // Objects (the held one rides with the robot, so skip it)
  for (const o of sim.objects || []) {
    if (o.name === sim.holding) continue;
    const x = px(o.x), y = py(o.y);
    if (FIXTURE_KINDS.has(o.kind)) {
      ctx.fillStyle = "#3d4a5d";
      ctx.fillRect(x - 5, y - 5, 10, 10);
      ctx.fillStyle = "#5d6b80";
      ctx.font = "9px system-ui";
      ctx.fillText(o.kind.replace("_", " "), x + 8, y + 3);
      continue;
    }
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = OBJECT_COLORS[o.kind] || "#d7dee8";
    ctx.fill();
    if (o.out_of_place) {
      ctx.beginPath();
      ctx.arc(x, y, 9, 0, Math.PI * 2);
      ctx.strokeStyle = "var(--bad)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.fillStyle = "#8593a5";
    ctx.font = "10px system-ui";
    ctx.fillText(o.kind, x + 8, y - 6);
  }

  // Learned room labels — what the robot has recognised on its own
  for (const [label, info] of Object.entries(recognition?.rooms || {})) {
    const x = px(info.x), y = py(info.y);
    ctx.fillStyle = "#41d98d";
    ctx.font = "bold 12px system-ui";
    ctx.fillText("✓ " + label.replace("_", " "), x - 24, y);
  }

  // Trail
  const p = sim.pose;
  trail.push([p.x, p.y]);
  if (trail.length > TRAIL_MAX) trail.shift();
  ctx.beginPath();
  trail.forEach(([tx, ty], i) => i ? ctx.lineTo(px(tx), py(ty)) : ctx.moveTo(px(tx), py(ty)));
  ctx.strokeStyle = "#4cc2ff44";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Robot body + heading (canvas y is flipped, so negate theta)
  const rx = px(p.x), ry = py(p.y);
  ctx.beginPath();
  ctx.arc(rx, ry, 11, 0, Math.PI * 2);
  ctx.fillStyle = sim.estopped ? "var(--bad)" : "var(--accent)";
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(rx, ry);
  ctx.lineTo(rx + 19 * Math.cos(-p.theta), ry + 19 * Math.sin(-p.theta));
  ctx.strokeStyle = "#eaf6ff";
  ctx.lineWidth = 2.5;
  ctx.stroke();
  if (sim.holding) {
    ctx.fillStyle = "#ffc857";
    ctx.font = "10px system-ui";
    ctx.fillText("✦ " + sim.holding, rx + 14, ry + 14);
  }
}

function populateRooms(sim) {
  if (roomsSeen || !sim || !sim.rooms) return;
  roomsSeen = true;
  for (const r of sim.rooms) {
    const opt = document.createElement("option");
    opt.value = r.name;
    opt.textContent = r.name.replace("_", " ");
    $("room-pick").appendChild(opt);
  }
}

// ── Polling loop ─────────────────────────────────────────────────────────────

async function poll() {
  try {
    const res = await fetch("/status");
    if (!res.ok) throw new Error(res.status);
    const s = await res.json();
    $("conn").textContent = "live";
    $("conn").className = "chip ok";
    renderStatus(s);
    renderMap(s.sim, s.recognition, s.mapping);
    populateRooms(s.sim);
  } catch {
    $("conn").textContent = "disconnected";
    $("conn").className = "chip bad";
  } finally {
    setTimeout(poll, POLL_MS);
  }
}

async function loadChores() {
  try {
    const chores = await (await fetch("/chores")).json();
    for (const [type, info] of Object.entries(chores)) {
      const opt = document.createElement("option");
      opt.value = type.includes(".") ? type.split(".").pop() : type;
      opt.textContent = info.name || type;
      $("chore").appendChild(opt);
    }
  } catch { /* chores stay empty; voice still works */ }
}

// ── Controls ─────────────────────────────────────────────────────────────────

$("voice-send").onclick = async () => {
  const command = $("voice").value.trim();
  if (!command) return;
  const r = await post("/voice", { command });
  if (r) { setMsg(`Queued via voice (${r.task_id.slice(0, 8)}…)`); $("voice").value = ""; }
};
$("voice").addEventListener("keydown", (e) => { if (e.key === "Enter") $("voice-send").click(); });

$("chore-send").onclick = async () => {
  const chore_type = $("chore").value;
  if (!chore_type) return;
  const room = $("room-pick").value || null;
  const r = await post("/tasks", { chore_type, room });
  if (r) setMsg(`Queued ${chore_type}${room ? " in " + room : ""} (${r.task_id.slice(0, 8)}…)`);
};

$("estop").onclick = async () => {
  const r = await post("/estop");
  if (r) setMsg("E-STOP triggered.", true);
};
$("estop-clear").onclick = async () => {
  const r = await post("/estop/clear");
  if (r) setMsg("E-stop cleared — robot is IDLE.");
};

loadChores();
poll();
</script>
</body>
</html>
